    <path d="M20 34 C20 58 24 78 32 94" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round" fill="none"/>
    <use href="#flower" transform="translate(48,64) scale(1.3)"/>
