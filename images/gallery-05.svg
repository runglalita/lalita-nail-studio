        <circle cx="4.1" cy="5.7" r="4.4"/>
        <circle cx="-4.1" cy="5.7" r="4.4"/>
        <circle cx="-6.7" cy="-2.2" r="4.4"/>
      </g>
      <circle cx="0" cy="0" r="3.2" fill="#C5A060"/>
    </g>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <g fill="#EAC9C4" opacity="0.5">
