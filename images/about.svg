<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="ภาพบรรยากาศร้านและอุปกรณ์ทำเล็บ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF6F0"/>
      <stop offset="1" stop-color="#F3E0DA"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8D8D4"/>
      <stop offset="0.6" stop-color="#E7A6A9"/>
      <stop offset="1" stop-color="#C97E86"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD3A6"/>
      <stop offset="1" stop-color="#BE9252"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="sparkle" d="M0 -10 L2.8 -2.8 L10 0 L2.8 2.8 L0 10 L-2.8 2.8 L-10 0 L-2.8 -2.8 Z"/>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <g fill="#EAC8C2" opacity="0.5">
    <circle cx="130" cy="170" r="110"/>
    <circle cx="690" cy="650" r="120"/>
  </g>

  <ellipse cx="400" cy="650" rx="150" ry="26" fill="#C9A08C" opacity="0.28"/>

  <g transform="translate(400,330)">
    <rect x="-95" y="0" width="190" height="280" rx="52" fill="url(#glass)"/>
    <rect x="-95" y="0" width="190" height="280" rx="52" fill="url(#shine)"/>
    <rect x="-95" y="128" width="190" height="40" fill="#FFFFFF" opacity="0.22"/>
    <rect x="-72" y="234" width="144" height="34" rx="17" fill="#FDF6F1" opacity="0.9"/>
    <text x="0" y="258" font-family="Georgia, serif" font-size="22" fill="#B07379" text-anchor="middle" font-style="italic">Lalita</text>

    <rect x="-34" y="-128" width="68" height="96" rx="16" fill="url(#capGrad)"/>
    <rect x="-34" y="-128" width="68" height="96" rx="16" fill="url(#shine)"/>
    <rect x="-22" y="-150" width="44" height="30" rx="12" fill="#EAD3A6"/>
  </g>

  <g fill="#C5A060">
    <use href="#sparkle" transform="translate(240,240) scale(1.3)"/>
    <use href="#sparkle" transform="translate(580,320) scale(1)"/>
    <use href="#sparkle" transform="translate(210,470) scale(0.8)"/>
    <use href="#sparkle" transform="translate(600,560) scale(1.1)"/>
  </g>
</svg>