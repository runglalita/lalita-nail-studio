<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="ภาพผลงานเล็บโทนชมพูสไตล์ Minimal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF6EF"/>
      <stop offset="1" stop-color="#F7E3DF"/>
    </linearGradient>
    <linearGradient id="nail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C6C9"/>
      <stop offset="1" stop-color="#DE9EA6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="nailShape" d="M14 126 C6 92 8 40 18 22 C25 10 75 10 82 22 C92 40 94 92 86 126 C79 134 21 134 14 126 Z"/>
    <path id="sparkle" d="M0 -10 L2.6 -2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6 -2.6 Z"/>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <g fill="#E7C7B8" opacity="0.5">
    <circle cx="120" cy="150" r="90"/>
    <circle cx="700" cy="210" r="120"/>
    <circle cx="640" cy="640" r="80"/>
  </g>

  <g fill="#D9AF98" opacity="0.55">
    <use href="#sparkle" transform="translate(200,240) scale(1.4)"/>
    <use href="#sparkle" transform="translate(585,160) scale(1.1)"/>
    <use href="#sparkle" transform="translate(120,430) scale(0.9)"/>
    <use href="#sparkle" transform="translate(690,420) scale(1.5)"/>
  </g>

  <g transform="translate(150,545) rotate(-20) scale(2)">
    <use href="#nailShape" fill="url(#nail)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#C98A94" opacity="0.35"/>
    <path d="M22 18 C20 44 24 70 30 92" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="30" r="3.4" fill="#C5A060"/>
  </g>
  <g transform="translate(330,585) rotate(-6) scale(2)">
    <use href="#nailShape" fill="url(#nail)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#C98A94" opacity="0.35"/>
    <path d="M22 18 C20 44 24 70 30 92" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <g transform="translate(500,585) rotate(6) scale(2)">
    <use href="#nailShape" fill="url(#nail)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#C98A94" opacity="0.35"/>
    <path d="M22 18 C20 44 24 70 30 92" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="30" r="3.4" fill="#C5A060"/>
  </g>
  <g transform="translate(650,545) rotate(20) scale(2)">
    <use href="#nailShape" fill="url(#nail)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#C98A94" opacity="0.35"/>
    <path d="M22 18 C20 44 24 70 30 92" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <g fill="#C5A060">
    <use href="#sparkle" transform="translate(130,610) scale(0.8)"/>
    <use href="#sparkle" transform="translate(660,620) scale(0.9)"/>
  </g>
</svg>