<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-label="ภาพเล็บเจลสวยโทนชมพู">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF6EF"/>
      <stop offset="0.5" stop-color="#FAE9E6"/>
      <stop offset="1" stop-color="#F3D6D7"/>
    </linearGradient>
    <linearGradient id="nailCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5CDCB"/>
      <stop offset="1" stop-color="#D9929C"/>
    </linearGradient>
    <linearGradient id="nailLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E2D4"/>
      <stop offset="1" stop-color="#DBB49D"/>
    </linearGradient>
    <linearGradient id="nailRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDC4CE"/>
      <stop offset="1" stop-color="#C98D9C"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="nailShape" d="M14 126 C6 92 8 40 18 22 C25 10 75 10 82 22 C92 40 94 92 86 126 C79 134 21 134 14 126 Z"/>
    <path id="sparkle" d="M0 -10 L2.8 -2.8 L10 0 L2.8 2.8 L0 10 L-2.8 2.8 L-10 0 L-2.8 -2.8 Z"/>
  </defs>

  <rect width="1000" height="1200" fill="url(#bg)"/>

  <g fill="#EBB9BC" opacity="0.4">
    <circle cx="130" cy="190" r="130"/>
    <circle cx="880" cy="240" r="150"/>
    <circle cx="860" cy="1030" r="130"/>
  </g>
  <g fill="none" stroke="#C9A060" stroke-opacity="0.5" stroke-width="2">
    <circle cx="500" cy="260" r="190"/>
    <path d="M120 660 Q 300 560 500 620 T 880 660" fill="none"/>
  </g>

  <g transform="translate(500,640) scale(3.4)">
    <use href="#nailShape" fill="url(#nailCenter)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#B65B68" opacity="0.3"/>
    <path d="M22 18 C20 46 25 76 34 96" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="30" r="3.4" fill="#C5A060"/>
  </g>
  <g transform="translate(240,790) rotate(-22) scale(2.4)">
    <use href="#nailShape" fill="url(#nailLeft)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#A06C5A" opacity="0.3"/>
    <circle cx="50" cy="48" r="3.6" fill="#C5A060"/>
  </g>
  <g transform="translate(760,790) rotate(22) scale(2.4)">
    <use href="#nailShape" fill="url(#nailRight)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#8E4A58" opacity="0.3"/>
    <circle cx="50" cy="48" r="3.6" fill="#C5A060"/>
  </g>

  <g fill="#C5A060">
    <use href="#sparkle" transform="translate(240,300) scale(1.6)"/>
    <use href="#sparkle" transform="translate(760,370) scale(1.2)"/>
    <use href="#sparkle" transform="translate(120,500) scale(0.9)"/>
    <use href="#sparkle" transform="translate(880,960) scale(1.3)"/>
  </g>
  <g fill="#D8A24A" opacity="0.8">
    <circle cx="210" cy="380" r="6"/>
    <circle cx="790" cy="820" r="5"/>
  </g>
