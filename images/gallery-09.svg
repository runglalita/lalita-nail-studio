<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="ภาพผลงานเล็บโทน Luxury ทองแชมเปญพร้อมเพชร">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF3E7"/>
      <stop offset="1" stop-color="#F2E0C8"/>
    </linearGradient>
    <linearGradient id="nail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D9AC"/>
      <stop offset="1" stop-color="#C9A060"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="nailShape" d="M14 126 C6 92 8 40 18 22 C25 10 75 10 82 22 C92 40 94 92 86 126 C79 134 21 134 14 126 Z"/>
    <path id="sparkle" d="M0 -10 L2.8 -2.8 L10 0 L2.8 2.8 L0 10 L-2.8 2.8 L-10 0 L-2.8 -2.8 Z"/>
    <g id="gem">
      <path d="M0 -7 L6 0 L0 7 L-6 0 Z" fill="#FFFFFF" opacity="0.95"/>
      <path d="M0 -7 L6 0 L0 0 Z" fill="#E7D3A6" opacity="0.9"/>
      <path d="M-6 0 L0 0 L0 7 L-6 0 Z" fill="#D9C290" opacity="0.95"/>
    </g>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <g fill="#E8CDA2" opacity="0.5">
    <circle cx="130" cy="170" r="100"/>
    <circle cx="680" cy="630" r="110"/>
  </g>

  <g transform="translate(150,545) rotate(-20) scale(2)">
    <use href="#nailShape" fill="url(#nail)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#A97F3E" opacity="0.35"/>
    <use href="#gem" transform="translate(50,38) scale(1.8)"/>
    <circle cx="30" cy="78" r="3.6" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <g transform="translate(330,585) rotate(-6) scale(2)">
    <use href="#nailShape" fill="url(#nail)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#A97F3E" opacity="0.35"/>
    <use href="#gem" transform="translate(68,40) scale(1.5)"/>
    <circle cx="34" cy="86" r="3.2" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <g transform="translate(500,585) rotate(6) scale(2)">
    <use href="#nailShape" fill="url(#nail)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#A97F3E" opacity="0.35"/>
    <use href="#gem" transform="translate(46,64) scale(1.9)"/>
  </g>
  <g transform="translate(650,545) rotate(20) scale(2)">
    <use href="#nailShape" fill="url(#nail)"/>
    <use href="#nailShape" fill="url(#shine)"/>
    <ellipse cx="50" cy="114" rx="30" ry="12" fill="#A97F3E" opacity="0.35"/>
    <use href="#gem" transform="translate(38,42) scale(1.6)"/>
    <circle cx="66" cy="84" r="3.4" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <g fill="#C5A060">
    <use href="#sparkle" transform="translate(210,230) scale(1.4)"/>
    <use href="#sparkle" transform="translate(600,190) scale(1.1)"/>
    <use href="#sparkle" transform="translate(140,420) scale(0.9)"/>
    <use href="#sparkle" transform="translate(660,430) scale(1.2)"/>
  </g>
</svg>